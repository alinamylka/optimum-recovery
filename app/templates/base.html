<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Optimum Recovery{% endblock %}</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1d1d1b; --muted:#6b6b66; --line:#e3e3de;
          --green:#2e9e5b; --amber:#e0a100; --red:#d64541; --accent:#2f6fde; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --card:#1f1f1d; --text:#ecece8; --muted:#9a9a93; --line:#34342f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, sans-serif; }
  header { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; }
  header a { color:inherit; text-decoration:none; font-weight:600; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:16px; }
  .muted { color:var(--muted); }
  .dot { display:inline-block; width:14px; height:14px; border-radius:50%; vertical-align:-2px; margin-right:6px; background:var(--line); }
  .green { background:var(--green); } .amber { background:var(--amber); } .red { background:var(--red); }
  .big { font-size:28px; font-weight:650; }
  .stats { display:flex; flex-wrap:wrap; gap:24px; margin-top:8px; }
  .stats div span { display:block; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  input, button, select { font:inherit; padding:7px 10px; border-radius:7px; border:1px solid var(--line); background:var(--card); color:inherit; }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; }
  button.plain { background:none; color:var(--muted); border:1px solid var(--line); }
  form.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .scroll { overflow-x:auto; }
  .error { color:var(--red); }
  a { color:var(--accent); }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .tabs a { padding:6px 12px; border:1px solid var(--line); border-radius:999px; text-decoration:none; color:var(--text); background:var(--card); }
  .tabs a.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .badge { display:inline-block; font-size:12px; padding:1px 8px; border-radius:999px; background:var(--green); color:#fff; margin-right:4px; }
  .badge.exp { background:var(--amber); }
  .sources li { margin-bottom:10px; }
  table.weeks tr.week { cursor:pointer; }
  table.weeks tr.week:hover td { background:var(--line); }
  table.weeks tr.summary td { white-space:normal; line-height:1.55; padding:10px 8px 14px; color:var(--text); background:var(--bg); }
</style>
</head>
<body>
<header>
  <a href="/">Optimum Recovery</a><span class="muted">POC</span>
  <nav style="margin-left:auto;display:flex;gap:14px;align-items:center">
    {% if me %}
    {% if me.profile_id %}<a href="/athletes/{{ me.profile_id }}" style="font-weight:400">My data</a>{% endif %}
    {% if me.role != 'athlete' %}<a href="/" style="font-weight:400">Athletes</a>{% endif %}
    {% if me.admin %}<a href="/users" style="font-weight:400">Users</a>{% endif %}
    <span class="muted">{{ me.username }} · {{ me.role }}</span>
    {% endif %}
  </nav>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
